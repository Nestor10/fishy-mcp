name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 23]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Lint
        run: sbt lint

      - name: Compile
        run: sbt compile

      - name: Core tests
        run: sbt core/test

      - name: Integration tests
        run: sbt integration/test

      - name: Example compile
        run: sbt example/compile
