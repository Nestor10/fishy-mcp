services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  mcp-server:
    image: localhost/fishy-mcp-example:latest
    ports:
      - "8889:8889"
    environment:
      REDIS_URL: "redis://redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "fishy-mcp-example"
    depends_on:
      - redis
      - jaeger

volumes:
  {}
